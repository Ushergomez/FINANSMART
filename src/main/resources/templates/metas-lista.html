<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Metas - FinanSmart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#f5f5f5; margin:0 }
    .navbar { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center }
    .container { max-width:1100px; margin:28px auto; padding:0 16px }
    .card { background:#fff; padding:18px; border:1px solid #eee; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); margin-bottom:18px }
    .btn { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; text-decoration:none; }
    table { width:100%; border-collapse:collapse }
    th, td { padding:10px 12px; border-bottom:1px solid #eee; text-align:left }
    th { color:#555; font-weight:600; background:#fafafa }
    .progress { height:10px; background:#eee; border-radius:8px; overflow:hidden }
    .bar { height:100%; background:#667eea }
    .row-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px }
    .muted { color:#666; font-size:13px }
    .pill { padding:4px 10px; border-radius:999px; font-size:12px; display:inline-block }
    .pill-green { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9 }
    .pill-gray { background:#eceff1; color:#455a64; border:1px solid #cfd8dc }
    .actions a, .actions form { display:inline-block; margin-right:6px }
    .flash-err { background:#ffebee; color:#c62828; padding:10px 14px; border:1px solid #ffcdd2; border-radius:6px; margin-bottom:12px }
    .flash-ok { background:#e8f5e9; color:#2e7d32; padding:10px 14px; border:1px solid #c8e6c9; border-radius:6px; margin-bottom:12px }
    input[type="date"]{ padding:8px 10px; border:1px solid #ddd; border-radius:6px }
  </style>
</head>
<body>
  <div class="navbar">
    <div>FinanSmart</div>
    <div>
      <a href="/dashboard" class="btn" style="background:#455a64">Dashboard</a>
      <a href="/logout" class="btn">Cerrar sesión</a>
    </div>
  </div>

  <div class="container">

    <div th:if="${error}" class="flash-err" th:text="${error}">Error</div>
    <div th:if="${success}" class="flash-ok" th:text="${success}">OK</div>

    <div class="card">
      <div class="row-header">
        <h2>Metas</h2>
        <div>
          <a href="/metas/nueva" class="btn">Nueva meta</a>
        </div>
      </div>

      <form method="get" action="/metas" style="margin-bottom:12px; display:flex; gap:10px; align-items:center;">
        <div>
          <label class="muted">Hasta fecha límite</label><br>
          <input type="date" name="hasta" th:value="${hasta}">
        </div>
        <div>
          <button class="btn" type="submit">Filtrar</button>
        </div>
      </form>

      <table>
        <thead>
        <tr>
          <th>Meta</th>
          <th>Objetivo</th>
          <th>Actual</th>
          <th>Progreso</th>
          <th>Fecha límite</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${metas}">
          <td th:text="${m.nombre}">Nombre</td>
          <td th:text="${#numbers.formatCurrency(m.montoObjetivo)}">$0</td>
          <td th:text="${#numbers.formatCurrency(m.montoActual)}">$0</td>
          <td>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span class="muted" th:text="${m.progresoPct} + '%'">0%</span>
            </div>
            <div class="progress">
              <div class="bar" th:style="'width:' + ${m.progresoPct} + '%;'"></div>
            </div>
          </td>
          <td th:text="${m.fechaLimite} ?: '-'">-</td>
          <td>
            <span th:classappend="${m.completada} ? ' pill pill-green' : ' pill pill-gray'"
                  th:text="${m.completada} ? 'Completada' : 'Activa'">Activa</span>
          </td>
          <td class="actions">
            <a th:href="@{'/metas/' + ${m.id} + '/editar'}" class="btn" style="padding:6px 10px;">Editar</a>
            <form th:action="@{'/metas/' + ${m.id} + '/eliminar'}" method="post" style="display:inline;">
              <button type="submit" class="btn" style="padding:6px 10px; background:#c62828;">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${metas == null or #lists.isEmpty(metas)}">
          <td colspan="7" class="muted">No hay metas registradas.</td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>
</body>
</html>
