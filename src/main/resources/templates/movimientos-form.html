<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title th:text="${movimiento.id} != null ? 'Editar movimiento - FinanSmart' : 'Nuevo Movimiento - FinanSmart'">Nuevo Movimiento - FinanSmart</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#f5f5f5; margin:0 }
    .navbar { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center }
    .container { max-width:700px; margin:28px auto; background:#fff; padding:24px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.08) }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px }
    label { display:block; margin:8px 0 6px; color:#333 }
    input, select, textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:6px }
    .btn { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; text-decoration:none; margin-top:14px }
    .flash-err { background:#ffebee; color:#c62828; padding:10px 14px; border:1px solid #ffcdd2; border-radius:6px; margin-bottom:12px }
    .flash-ok { background:#e8f5e9; color:#2e7d32; padding:10px 14px; border:1px solid #c8e6c9; border-radius:6px; margin-bottom:12px }
  </style>
</head>
<body>
  <div class="navbar">
    <div>FinanSmart</div>
    <div>
      <a href="/movimientos" class="btn" style="background:#455a64">Volver</a>
      <a href="/logout" class="btn">Cerrar sesión</a>
    </div>
  </div>

  <div class="container">
    <h1 th:text="${movimiento.id} != null ? 'Editar movimiento' : 'Nuevo movimiento'">Nuevo movimiento</h1>

    <div th:if="${error}" class="flash-err" th:text="${error}">Error</div>
    <div th:if="${success}" class="flash-ok" th:text="${success}">OK</div>

    <form th:action="${movimiento.id} != null ? @{'/movimientos/' + ${movimiento.id}} : @{/movimientos}"
          method="post" th:object="${movimiento}">
  
      <div class="form-row">
        <div>
          <label>Tipo</label>
          <select th:field="*{tipo}" required>
            <option th:value="INGRESO">Ingreso</option>
            <option th:value="GASTO">Gasto</option>
          </select>
        </div>
        <div>
          <label>Categoría</label>
          <input type="text" th:field="*{categoria}" placeholder="Ej: Salario, Comida, Transporte" required>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>Monto</label>
          <input type="number" th:field="*{monto}" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" th:field="*{fecha}" required>
        </div>
      </div>

      <div>
        <label>Descripción (opcional)</label>
        <textarea th:field="*{descripcion}" rows="3" placeholder="Detalle del movimiento"></textarea>
      </div>

      <button class="btn" type="submit" th:text="${movimiento.id} != null ? 'Actualizar' : 'Guardar'">Guardar</button>
    </form>
  </div>
</body>
</html>
