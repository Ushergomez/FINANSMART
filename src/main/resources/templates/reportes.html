<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reportes - FinanSmart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background: #f5f5f5; margin: 0; }
    .navbar { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 900px; margin: 28px auto; background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 2rem; color: #333; margin-top: 10px; margin-bottom: 24px; }
    .section { margin-bottom: 36px; }
    .placeholder { border: 2px dashed #b2b2b2; background: #fafafa; color: #888; text-align: center; padding: 32px; border-radius: 12px; font-size: 18px; margin-top: 18px; }
    .btn { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; text-decoration:none; }
    .navbar a { color: #fff; text-decoration: none; margin-left: 16px; }
    .centrado-canvas { max-width: 420px; margin: 0 auto; height: 320px; }
    #grafico-categoria { width: 100% !important; height: 320px !important; }
    #grafico-metas { width: 100% !important; max-width: 680px; margin: 0 auto; }
    .filtro-fechas { margin-bottom: 28px; display: flex; gap: 22px; align-items: flex-end; }
    .filtro-fechas label { display: block; font-size: 15px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="navbar">
    <div>📊 FinanSmart</div>
    <div>
      <a href="/dashboard" class="btn" style="background:#455a64">Dashboard</a>
      <a href="/movimientos" class="btn">Movimientos</a>
      <a href="/metas" class="btn">Metas</a>
      <a href="/reportes" class="btn" style="background:#7e57c2">Reportes</a>
      <a href="/logout" class="btn">Cerrar sesión</a>
    </div>
  </div>

  <div class="container">
    <h1>Reportes financieros</h1>

    <form method="get" th:action="@{/reportes}" class="filtro-fechas">
      <div>
        <label>Fecha inicio</label>
        <input type="date" name="inicio" th:value="${fechaInicio}">
      </div>
      <div>
        <label>Fecha fin</label>
        <input type="date" name="fin" th:value="${fechaFin}">
      </div>
      <div>
        <button type="submit" class="btn">Actualizar</button>
      </div>
    </form>

    <div class="section">
      <h2>Resumen mensual de ingresos y gastos</h2>
      <canvas id="grafico-mensual" height="80"></canvas>
    </div>

    <div class="section">
      <h2>Gastos por categoría (periodo filtrado)</h2>
      <div class="centrado-canvas">
        <canvas id="grafico-categoria"></canvas>
      </div>
    </div>

    <div class="section">
      <h2>Avance de tus metas de ahorro (%)</h2>
      <canvas id="grafico-metas" height="120"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script th:inline="javascript">
   
    var meses    = /*[[${meses}]]*/ [];
    var ingresos = /*[[${ingresos}]]*/ [];
    var gastos   = /*[[${gastos}]]*/ [];

    var ctx = document.getElementById('grafico-mensual').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: meses,
        datasets: [
          { label: 'Ingresos', data: ingresos, backgroundColor: '#43a047' },
          { label: 'Gastos', data: gastos, backgroundColor: '#e53935' }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top' }, title: { display: false } }
      }
    });

    var catLabels = /*[[${catLabels}]]*/ [];
    var catValues = /*[[${catValues}]]*/ [];
    var ctxCat = document.getElementById('grafico-categoria').getContext('2d');
    new Chart(ctxCat, {
      type: 'pie',
      data: {
        labels: catLabels,
        datasets: [{
          data: catValues,
          backgroundColor: [
            '#ef5350','#ab47bc','#42a5f5','#29b6f6','#26a69a','#e1b03b','#66bb6a','#ffa726','#8d6e63'
          ]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          title: { display: false }
        }
      }
    });

    var metaEtiquetas = /*[[${metaNombres}]]*/ [];
    var metaAvance = /*[[${progreso}]]*/ [];
    var ctxMetas = document.getElementById('grafico-metas').getContext('2d');
    new Chart(ctxMetas, {
      type: 'bar',
      data: {
        labels: metaEtiquetas,
        datasets: [{
          label: 'Porcentaje completado',
          data: metaAvance,
          backgroundColor: '#42a5f5'
        }]
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true, max: 100 } },
        plugins: {
          legend: { display: false },
          title: { display: false }
        }
      }
    });
  </script>
</body>
</html>
